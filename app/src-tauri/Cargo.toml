[package]
name = "hybridcam-desktop"
version = "0.1.0"
edition = "2021"

[workspace]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.10", features = ["v4"] }
image = "0.25"
rfd = "0.15"
hybridcam-geom = { path = "../../crates/hybridcam-geom" }
hybridcam-relief = { path = "../../crates/hybridcam-relief" }
hybridcam-cam = { path = "../../crates/hybridcam-cam" }
hybridcam-sim = { path = "../../crates/hybridcam-sim" }
hybridcam-post = { path = "../../crates/hybridcam-post" }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
